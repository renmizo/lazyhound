[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyhound"
version = "0.5.5.1"
description = "Active Directory & Entra attack-path analysis tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "renmizo" }]
keywords = ["active-directory", "entra", "bloodhound", "attack-paths", "pentest", "security"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "impacket>=0.11",
    "ldap3>=2.9",
    "dnspython>=2.4",
    "pycryptodome>=3.19",
    "Pillow>=10.0",
    "requests>=2.28",
]

[project.optional-dependencies]
reports = [
    "python-docx>=1.0",
    "weasyprint>=60.0",
    "markdown>=3.5",
]
all = [
    "lazyhound[reports]",
]

[project.urls]
Homepage = "https://github.com/renmizo/lazyhound"
Repository = "https://github.com/renmizo/lazyhound"
Issues = "https://github.com/renmizo/lazyhound/issues"

[project.scripts]
lazyhound = "lazyhound.cli:main"

[tool.setuptools.packages.find]
include = ["lazyhound*"]

[tool.setuptools.package-data]
lazyhound = [
    "finder/reports/visualize/icons/*.png",
    "finder/reports/assets/*.js",
    "finder/reports/assets/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
